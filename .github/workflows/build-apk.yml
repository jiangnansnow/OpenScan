name: Build Chinese APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build release APK (zh-Hans)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify Chinese locale is wired up
        run: |
          set -e
          test -f lib/l10n/app_zh.arb
          test -f lib/l10n/app_localizations_zh.dart
          grep -q "zh" lib/l10n/l10n.dart
          echo "zh locale files present and referenced in l10n.dart"

      - name: Create keystore for signing
        run: |
          set -e
          mkdir -p "$HOME/keys"
          keytool -genkeypair -v \
            -keystore "$HOME/keys/openscan.jks" \
            -alias openscan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass openscan -keypass openscan \
            -dname "CN=OpenScan Local Build, OU=Personal, O=OpenScan, C=CN"
          {
            echo "storePassword=openscan"
            echo "keyPassword=openscan"
            echo "keyAlias=openscan"
            echo "storeFile=$HOME/keys/openscan.jks"
          } > android/key.properties
          cat android/key.properties

      - name: Build release APK (per-ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        if: success()
        run: flutter build apk --release

      - name: Fall back to debug build if release failed
        if: failure()
        run: |
          set -e
          echo "Release build failed; falling back to a debug APK so an installable artifact still exists."
          flutter build apk --debug

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openscan-zh-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to rolling release
        if: startsWith(github.ref, 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          tag_name: ci-build
          name: OpenScan 简体中文版 (自签名构建)
          body: |
            由 GitHub Actions 自动构建，源自分支 master（已包含简体中文翻译）。

            包含简体中文界面。语言跟随系统：手机系统为简体中文时，App 会自动显示中文。

            注意：这是自签名包，与 Google Play 上的官方签名不同，无法直接覆盖安装官方版。
            如已安装官方版，请先卸载再安装此包。安装前请确认系统设置中已允许安装未知来源应用。
          draft: false
          prerelease: true
          make_latest: false